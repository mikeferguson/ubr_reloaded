robot_calibration:
  ros__parameters:
    chains:
    - arm
    arm:
      topic: /arm_controller/follow_joint_trajectory
      joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - upperarm_roll_joint
      - elbow_flex_joint
      - forearm_roll_joint
      - wrist_flex_joint
      - wrist_roll_joint
    features:
    - checkerboard_finder
    checkerboard_finder:
      type: robot_calibration::CheckerboardFinder
      topic: /gripper_camera/depth_registered/points
      camera_info_topic: /gripper_camera/depth_registered/camera_info
      camera_sensor_name: gripper_camera  # This is actually the camera on the arm (it moves)
      chain_sensor_name: fixed  # The checkerboard is fixed
      debug: false
      points_x: 6
      points_y: 7
      size: 0.02635
